<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 flex items-center justify-center h-screen">

<form method="post" action="/login" class="bg-gray-800 p-8 rounded-xl w-80">
    <h2 class="text-white text-xl mb-4">Admin Login</h2>

    <input name="username" placeholder="Username"
        class="w-full mb-3 p-2 rounded bg-gray-700 text-white">

    <input name="password" type="password" placeholder="Password"
        class="w-full mb-3 p-2 rounded bg-gray-700 text-white">

    <button class="w-full bg-blue-500 p-2 rounded text-white">
        Login
    </button>

</form>

</body>
</html>
