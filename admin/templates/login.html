<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Вход — Круг Души</title></head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-4 text-white">
<form method="post" action="/login" class="w-full max-w-sm rounded-2xl border border-slate-700 bg-slate-900 p-7 shadow-2xl">
  <div class="text-xs uppercase tracking-[.22em] text-slate-400">Круг Души</div>
  <h1 class="mt-2 text-2xl font-semibold">Вход в систему</h1>
  <p class="mt-2 text-sm text-slate-400">Введите данные своей учётной записи.</p>
  {% if error %}<p role="alert" class="mt-4 rounded-lg border border-red-900 bg-red-950/60 p-3 text-sm text-red-200">{{ error }}</p>{% endif %}
  <label class="mt-5 block text-sm text-slate-300">Логин<input name="username" required autocomplete="username" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-indigo-500"></label>
  <label class="mt-4 block text-sm text-slate-300">Пароль<input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-indigo-500"></label>
  <button class="mt-6 w-full rounded-lg bg-indigo-600 p-3 font-medium hover:bg-indigo-500">Войти</button>
</form>
</body></html>
