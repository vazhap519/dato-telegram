<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><title>Проблемные доставки</title></head><body class="bg-gray-900 text-white min-h-screen">{% include "_sidebar.html" %}<main class="max-w-5xl mx-auto p-5 md:p-8 space-y-5"><h1 class="text-3xl font-bold">Проблемные доставки</h1><p class="text-gray-400 text-sm">Ошибки отправки и неопределённые результаты. Автоматической повторной отправки нет.</p><section class="bg-gray-800 rounded-xl p-4 space-y-2">{% for x in failures %}<div class="bg-gray-700/50 rounded-lg p-3 text-sm flex justify-between gap-3"><span>{{ x.kind }} · {{ x.detail or 'Причина неизвестна' }} · {{ x.telegram_id }}</span><a href="/subscriptions/users/{{ x.telegram_id }}" class="text-sky-300 underline">Карточка</a></div>{% else %}<p class="text-emerald-300">Проблемных отправок нет.</p>{% endfor %}</section></main></body></html>
