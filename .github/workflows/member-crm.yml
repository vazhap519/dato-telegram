name: Telegram member CRM checks
on:
  pull_request:
    paths:
      - 'admin/members_miniapp.py'
      - 'admin/templates/members_miniapp.html'
      - 'tests/test_member_crm_miniapp.py'
      - '.github/workflows/member-crm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python regressions
        run: |
          python -m compileall -q admin/members_miniapp.py
          python -m unittest discover -s tests -p 'test_member_crm_miniapp.py' -v
          python -m unittest discover -s tests -p 'test_members_miniapp.py' -v
          python -m unittest discover -s tests -p 'test_command_center_miniapp.py' -v
          python -m unittest discover -s tests -p 'test_owner_alerts.py' -v
          python -m unittest discover -s tests -p 'test_support_permissions.py' -v
      - name: Member Mini App JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('admin/templates/members_miniapp.html').read_text()
          js=[s for s in re.findall(r'<script>(.*?)</script>',html,re.S) if s.strip()]
          assert len(js)==1
          Path('/tmp/member_crm_test.js').write_text(js[0])
          PY
          node --check /tmp/member_crm_test.js
