name: Telegram support permission checks

on:
  pull_request:
    paths:
      - 'admin/**'
      - 'bot/**'
      - 'db/**'
      - 'tests/test_support_permissions.py'
      - 'scripts/check_support_branch_readonly.sh'
      - 'scripts/check_support_db_readonly.py'
      - 'scripts/migrate_support_staff_permissions.py'
      - 'scripts/prepare_support_candidate.py'
      - '.github/workflows/support-permissions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  permission-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all application Python files
        run: python -m compileall -q admin bot db scripts/migrate_support_staff_permissions.py scripts/check_support_db_readonly.py scripts/prepare_support_candidate.py scripts/update_system_safe.py scripts/deploy_admin_bluegreen.py scripts/update_bot_safe.py
      - name: Support permission regression checks
        run: python -m unittest discover -s tests -p test_support_permissions.py -v
